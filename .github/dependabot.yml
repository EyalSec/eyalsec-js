# Dependabot keeps the pinned GitHub Actions and the development tools up to
# date. Updates arrive as pull requests once a week, grouped per ecosystem.
# The published package has no runtime dependencies.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        patterns:
          - "*"
    ignore:
      # The type definitions follow the oldest Node.js this package supports
      # (engines in package.json), so a newer major would let code through
      # that does not run there.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
